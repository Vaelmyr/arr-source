name: arr-downloader
services:
    seerr:
        image: ghcr.io/seerr-team/seerr:${SEERR_IMAGE_TAG:-latest}
        init: true
        pull_policy: ${SEERR_PULL_POLICY:-daily}
        env_file: .env
        environment:
            - LOG_LEVEL=debug
        ports:
            - '127.0.0.1:5055:5055'
        volumes:
            - ${CONFIG_ROOT:-.}/seerr:/app/config
        healthcheck:
            test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
            start_period: 20s
            timeout: 3s
            interval: 1m
            retries: 10

    sonarr:
        image: lscr.io/linuxserver/sonarr:${SONARR_IMAGE_TAG:-latest}
        pull_policy: ${SONARR_PULL_POLICY:-daily}
        env_file: .env
        ports:
            - '127.0.0.1:8989:8989'
        volumes:
            - ${CONFIG_ROOT:-.}/sonarr:/config
            - ${DATA_ROOT}:/data
        healthcheck:
            test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8989/sonarr/ping']
            interval: 1m
            retries: 10

    jellyfin:
        image: lscr.io/linuxserver/jellyfin:${JELLYFIN_IMAGE_TAG:-latest}
        pull_policy: ${JELLYFIN_PULL_POLICY:-daily}
        env_file: .env
        ports:
            - '127.0.0.1:8096:8096'
            # - '7359:7359/udp'
            # - '1900:1900/udp'
        volumes:
            - ${CONFIG_ROOT:-.}/jellyfin:/config
            - ${DATA_ROOT}:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '--fail',
                    'http://127.0.0.1:8096/jellyfin/health',
                ]
            interval: 1m
            retries: 10
